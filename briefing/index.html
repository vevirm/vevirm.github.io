<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="radar-insights-build" content="simple-topic-bullets-v7">
<title>Radar insights</title>
<style>
:root{--bg:#f7f6f2;--ink:#171716;--muted:#68645e;--line:#d8d5ce;--accent:#741b25;--max:940px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);background:var(--bg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:inherit}
.wrap{width:min(calc(100% - 36px),var(--max));margin:0 auto}
header{padding:38px 0 24px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(2.25rem,7vw,4rem);line-height:.98;letter-spacing:-.05em}
.lede{margin:10px 0 0;color:var(--muted);max-width:700px}
.back{display:inline-block;margin-top:14px;color:var(--accent);font-size:.9rem;font-weight:750;text-decoration:none}
main{padding:8px 0 58px}
.topic{padding:27px 0 24px;border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:0}
h2{margin:0 0 11px;font-size:1.45rem;line-height:1.15;letter-spacing:-.03em}
ul{margin:0;padding-left:1.25em}
li{margin:.56em 0;padding-left:.12em;max-width:900px}
.state{padding:34px 0;color:var(--muted)}
@media(max-width:640px){body{font-size:16px}.wrap{width:min(calc(100% - 28px),var(--max))}header{padding-top:28px}.topic{padding:22px 0 19px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Radar insights</h1>
    <p class="lede">What the radar is saying, grouped by topic. One signal, one clear point.</p>
    <a class="back" href="../">← Main radar</a>
  </div>
</header>
<main class="wrap" id="insights"><p class="state">Loading insights…</p></main>
<script src="insights.js?v=7"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(groups){
  const root=document.getElementById('insights');
  if(!groups.length){root.innerHTML='<p class="state">No radar items are available yet.</p>';return}
  root.innerHTML=groups.map(g=>`<section class="topic"><h2>${esc(g.name)}</h2><ul>${g.items.map(x=>`<li>${esc(x.point)}</li>`).join('')}</ul></section>`).join('');
}
(async()=>{
  try{
    const r=await fetch('../radar.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('radar.json unavailable');
    render(RadarInsights.buildInsights(await r.json()));
  }catch(e){
    document.getElementById('insights').innerHTML='<p class="state">Radar data is not available yet.</p>';
  }
})();
</script>
</body>
</html>
