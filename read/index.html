<header><div class="wrap top"><div><h1>Read at least this</h1></div><nav class="nav" aria-label="Primary site sections"><a href="../">Start</a><a href="../radar/">Main Radar</a><a class="primary" href="./" aria-current="page">Read at least this</a><a href="../frontier/quick/">Matrix</a><a href="../trends/">Trends</a><a href="../phenomena/">Ongoing phenomena</a><a href="../priorities/">Risks &amp; opportunities</a><a href="../shocks/">External shocks</a><a href="../historical/">Historical</a><a href="../literature/">Sources</a><a href="../stuff/">Stuff</a></nav></div></header>

<script>
const surface=v=>globalThis.RadarReaderStyle?.surfaceText?.(v)||String(v||'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nodeContent(n){
  const q=encodeURIComponent(n?.query||n?.label||'');
  const label=surface(n?.label); const source=n?.sourceLink?`<a class="node-title" href="${esc(n.sourceLink)}" target="_blank" rel="noopener" title="Open strongest supporting source">${esc(label)}</a>`:`<a class="node-title" href="../radar/?q=${q}" title="Show supporting Radar material">${esc(label)}</a>`;
  const count=Number(n?.evidenceCount||0);
  const meta=count?`<div class="node-meta"><span>${count} ${count===1?'item':'items'}</span><span>·</span><a href="../radar/?q=${q}">Open Radar evidence →</a></div>`:'';
  const pair=globalThis.RadarReaderStyle?.pagePair?.(n?.what||'',n?.why||'',20,20)||{what:surface(n?.what),why:surface(n?.why)};
  const what=pair.what?`<div class="node-what"><strong>WHAT:</strong> ${esc(pair.what)}</div>`:'';
  const why=pair.why?`<div class="node-why"><strong>WHY:</strong> ${esc(pair.why)}</div>`:'';
  return source+what+why+meta;
}
function chart(x,i){return `<section class="issue-chart" aria-label="Topic ${i+1}: ${esc(x.main.label)}"><div class="chart-no">${String(i+1).padStart(2,'0')}</div><div class="node main">${nodeContent(x.main)}</div><details class="issue-depth"><summary>Explore this topic</summary><div class="node sub one">${nodeContent(x.subs[0]||{label:'Current movement'})}</div><div class="node sub two">${nodeContent(x.subs[1]||{label:'Consequences'})}</div><div class="node leaf one">${nodeContent(x.leaves[0]||{label:'Connected development'})}</div><div class="node leaf two">${nodeContent(x.leaves[1]||{label:'Connected development'})}</div><div class="node leaf three">${nodeContent(x.leaves[2]||{label:'Connected development'})}</div></details></section>`}
(async()=>{try{const d=await RadarData.load('../radar.json','../radar_seed.json');const items=[...(d.strand_a||[]),...(d.strand_c||[])];const trees=globalThis.RadarIssues?.buildTrees?RadarIssues.buildTrees(items,{count:8}):[];document.getElementById('trees').innerHTML=trees.length?trees.map(chart).join(''):'<div class="empty">No topic maps available.</div>'}catch(e){console.error(e);document.getElementById('trees').innerHTML='<div class="empty">Topic maps unavailable.</div>'}})();
</script>
