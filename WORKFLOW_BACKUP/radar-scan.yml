name: R&I Radar Scan

on:
  # FIRST SCAN: the upload/commit that adds this repository starts a scan immediately.
  push:
    branches:
      - main
    paths-ignore:
      - radar.json

  # THEN: every 12 hours. :23 avoids the busiest top-of-hour scheduling period.
  schedule:
    - cron: '23 */12 * * *'

  # Also allows Actions -> R&I Radar Scan -> Run workflow.
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ri-geopolitics-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run admission-gate tests
        run: python -m unittest discover -s tests -v

      - name: Scan radar sources
        run: python scripts/scan_radar.py

      - name: Commit fresh radar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.json

          if git diff --cached --quiet; then
            echo "No radar data change to commit."
          else
            git commit -m "Update R&I geopolitics radar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Commits made with GITHUB_TOKEN do not themselves trigger a branch-source
      # GitHub Pages build, so request a Pages build explicitly after the scan.
      - name: Publish fresh radar on GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
